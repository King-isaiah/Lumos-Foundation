<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create Exam — Lumos Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/toast.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="margin: 0;">Create New Exam</h2>
      <a href="./exams.html" class="btn-action" style="text-decoration: none; font-size: 14px; padding: 10px 20px;">&larr; Back to Exams</a>
    </div>

    <p style="color: var(--text-muted); margin-bottom: 30px;">Set the details, date, and prize pool for a new Lumos CBT exam.</p>
    
    <form id="examForm">
      <div class="form-grid">
        <div class="form-group full">
          <label>Exam Title</label>
          <input type="text" name="title" placeholder="e.g., National Physics Olympiad 2026" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" name="subject" placeholder="e.g., Physics" required>
        </div>
        <div class="form-group">
          <label>Price (₦)</label>
          <input type="number" name="price_naira" placeholder="e.g., 5000" required min="100">
        </div>
        <div class="form-group">
          <label>Duration (Minutes)</label>
          <input type="number" name="duration_minutes" placeholder="e.g., 60" required min="10">
        </div>
        <div class="form-group">
          <label>Total Questions</label>
          <input type="number" name="question_count" placeholder="e.g., 50" required min="1">
        </div>
        <div class="form-group full">
          <label>Exam Description</label>
          <textarea name="description" rows="3" placeholder="Brief overview of the exam..."></textarea>
        </div>
        <div class="form-group">
          <label>Starts At</label>
          <input type="datetime-local" name="starts_at" required>
        </div>
        <div class="form-group">
          <label>Ends At</label>
          <input type="datetime-local" name="ends_at" required>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Create Exam</button>
    </form>
  </div>

  <script type="module">
    import { api } from '../assets/js/core/api.js';
    import { toast } from '../assets/js/core/toast.js';
    import '../assets/js/core/layout.js';

    const form = document.getElementById('examForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Creating...';
      
      const payload = {
        title: form.elements.title.value,
        subject: form.elements.subject.value,
        description: form.elements.description.value,
        price_kobo: parseInt(form.elements.price_naira.value) * 100,
        duration_minutes: form.elements.duration_minutes.value,
        question_count: form.elements.question_count.value,
        starts_at: form.elements.starts_at.value,
        ends_at: form.elements.ends_at.value,
        prize_pool_pct: 60
      };

      try {
        const res = await api('exams', 'create', { method: 'POST', body: payload });
        toast.success('Exam created successfully!');
        // Redirect to the Manage Questions page
        setTimeout(() => location.href = `./questions.html?exam_id=${res.id}`, 1000);
      } catch (err) {
        toast.error(err.message || 'Failed to create exam.');
        btn.disabled = false; btn.textContent = 'Create Exam';
      }
    });
  </script>
</body>
</html>
